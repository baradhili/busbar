name: CI

# Fast-dev policy (see AGENTS.md): every branch is tested; superseded runs
# cancel; no release-profile builds, artifacts, or publishing — enforced by
# the guard below, whose patterns are split so it never matches itself.

on:
  push:
    branches-ignore: [renovate/**]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint + docs (debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Guard - no release builds while in fast dev
        run: |
          if grep -rn -- "--rel""ease" .github/workflows \
             || grep -rn -- "upload-""artifact" .github/workflows \
             || ls .github/workflows/rel*.yml >/dev/null 2>&1; then
            echo "release-profile builds or artifacts are disabled during fast dev"
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI (debug) for the acceptance suite
        run: cargo build -p busbar-cli
      - name: Unit, corpus, and Cucumber suites (debug profile)
        run: cargo test --workspace
      - name: Cucumber summary
        if: always()
        run: cargo test --test cucumber 2>&1 | tail -5 || true
